[project]
name = "nullprime"
version = "0.1.0"
description = "An in-distribution dataset whose label can't be learned from its features: a negative control for uncertainty and abstention."
readme = "README.md"
license = "MIT"
authors = [{ name = "Brian Miedlar" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
certify = ["numpy==2.5.4", "scikit-learn==1.9.1"]
transformer = ["torch==2.14.1"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nullprime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
